name: Build static site for local publication
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reject tracked local authentication folders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          for name in files:
              if {'.secret','.secrets'}.intersection(Path(name).parts):
                  raise SystemExit('Local authentication folder is tracked: '+name)
          PY
      - name: Build existing static generator
        run: node static/build.mjs
      - name: Validate generated public files and create handoff archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,xml.etree.ElementTree as ET,zipfile
          root=Path('site')
          for name in ['index.html','robots.txt','sitemap.xml']:
              if not (root/name).is_file():raise SystemExit('Generated public file missing: '+name)
          ET.parse(root/'sitemap.xml')
          marker=root/'.well-known/site-build.json';marker.parent.mkdir(exist_ok=True)
          marker.write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'published':False})+'\n')
          files=[]
          for p in sorted(root.rglob('*')):
              rel=p.relative_to(root)
              if p.is_symlink() or any(x.startswith('.') and x!='.well-known' for x in rel.parts):raise SystemExit('Non-public generated path: '+str(rel))
              if p.is_file():
                  if p.suffix in {'.map','.mjs','.ts','.tsx','.py','.md','.toml'}:raise SystemExit('Source file in public output: '+str(rel))
                  if p.stat().st_size>25*1024*1024:raise SystemExit('Generated asset exceeds budget: '+str(rel))
                  if ('CLOUDFLARE_'+'API_TOKEN').encode() in p.read_bytes():raise SystemExit('Deployment credential reference in public output')
                  files.append(p)
          out=Path('.release-bundles');out.mkdir()
          archive=out/'public-site.zip'
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to(root))
          (out/'SHA256SUMS').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  public-site.zip\n')
          print('Built and checked',len(files),'public files. No production publication or lead-delivery test.')
          PY
      - name: Save public-only build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-site-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .release-bundles/public-site.zip
            .release-bundles/SHA256SUMS
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
